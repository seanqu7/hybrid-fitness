<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0E17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DUO Training" />
    <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
  <title>DUO Training</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0A0E17',
            surface: '#121826',
            card: '#182032',
            cardHover: '#1E283D',
            mint: '#2EE6A6',
            teal: '#00C49A',
            sky: '#38BDF8',
            amber: '#F59E0B',
            danger: '#F43F5E'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      color-scheme: dark;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0A0E17;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .safe-top { padding-top: max(12px, var(--sat)); }
    .safe-bottom { padding-bottom: max(12px, var(--sab)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    .set-check {
      transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .set-check.checked {
      background: linear-gradient(135deg, #2EE6A6, #00C49A);
      border-color: #2EE6A6;
      color: #061210;
      transform: scale(1.04);
    }
    .fade-in {
      animation: fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-bg text-slate-100 min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-bg/85 backdrop-blur-xl border-b border-white/5 safe-top">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <img id="app-logo" src="/icons/icon-192.png" alt="DUO Training" class="w-9 h-9 rounded-xl object-cover ring-1 ring-white/10 shrink-0" />
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="font-bold tracking-tight text-base text-white truncate">DUO Training</span>
            <span id="storage-badge" class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-mint/15 text-mint">DB</span>
          </div>
          <p id="header-subtitle" class="text-[11px] text-slate-400 truncate">8-Week Hybrid Full Body</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="unit-toggle-btn" type="button" class="px-2.5 py-1.5 rounded-xl bg-card border border-white/10 text-xs font-semibold text-mint hover:bg-cardHover active:scale-95 transition tabular-nums min-h-[36px]" aria-label="Toggle weight unit">
          lb
        </button>
        <button id="open-settings-btn" type="button" class="w-9 h-9 rounded-xl bg-card border border-white/10 flex items-center justify-center text-slate-300 hover:text-white hover:bg-cardHover active:scale-95 transition" aria-label="Settings and Backup">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="flex-1 max-w-lg w-full mx-auto px-4 pt-4 pb-36">
    <!-- Rendered dynamically -->
  </main>

  <!-- Floating Rest Timer Bar (shown when timer is active or paused) -->
  <div id="rest-timer-bar" class="hidden fixed left-0 right-0 z-40 px-4 transition-all duration-200" style="bottom: calc(74px + env(safe-area-inset-bottom, 0px));">
    <div class="max-w-lg mx-auto rounded-2xl bg-surface/95 backdrop-blur-xl border border-mint/30 shadow-2xl shadow-black/60 p-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-mint/15 flex items-center justify-center text-mint shrink-0">
          <i data-lucide="timer" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <div class="text-[11px] font-medium text-slate-400 truncate" id="rest-timer-label">Rest Timer</div>
          <div class="text-xl font-bold text-white tabular-nums leading-tight" id="rest-timer-display">03:30</div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="rest-minus-btn" type="button" class="px-2.5 py-2 rounded-xl bg-card text-xs font-semibold text-slate-200 hover:bg-cardHover active:scale-95 min-h-[40px]">-30s</button>
        <button id="rest-plus-btn" type="button" class="px-2.5 py-2 rounded-xl bg-card text-xs font-semibold text-slate-200 hover:bg-cardHover active:scale-95 min-h-[40px]">+30s</button>
        <button id="rest-toggle-btn" type="button" class="w-10 h-10 rounded-xl bg-mint text-bg flex items-center justify-center font-bold active:scale-95" aria-label="Pause or resume rest timer">
          <i data-lucide="pause" class="w-4 h-4"></i>
        </button>
        <button id="rest-reset-btn" type="button" class="w-10 h-10 rounded-xl bg-card text-slate-300 hover:text-white flex items-center justify-center active:scale-95" aria-label="Reset rest timer">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
        <button id="rest-close-btn" type="button" class="w-9 h-10 rounded-xl bg-transparent text-slate-400 hover:text-white flex items-center justify-center" aria-label="Dismiss rest timer">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 z-30 bg-surface/92 backdrop-blur-xl border-t border-white/8 safe-bottom">
    <div class="max-w-lg mx-auto grid grid-cols-4 px-2 pt-1.5 pb-1">
      <button type="button" data-tab="home" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-mint min-h-[50px] transition">
        <i data-lucide="home" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-semibold">Home</span>
      </button>
      <button type="button" data-tab="program" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400 hover:text-slate-200 min-h-[50px] transition">
        <i data-lucide="layers" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-medium">Program</span>
      </button>
      <button type="button" data-tab="history" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400 hover:text-slate-200 min-h-[50px] transition">
        <i data-lucide="clock" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-medium">History</span>
      </button>
      <button type="button" data-tab="records" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-slate-400 hover:text-slate-200 min-h-[50px] transition">
        <i data-lucide="trophy" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[11px] font-medium">Records</span>
      </button>
    </div>
  </nav>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-panel" class="w-full max-w-lg bg-surface border border-white/10 rounded-t-3xl sm:rounded-3xl max-h-[88vh] overflow-y-auto p-5 safe-bottom shadow-2xl">
      <!-- Modal content injected here -->
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-card border border-mint/30 text-sm font-medium text-white shadow-xl flex items-center gap-2 max-w-[90vw]">
    <span id="toast-text">Saved</span>
  </div>

            const req = indexedDB.open(DB_NAME, DB_VERSION);

              tx.objectStore('state').clear();
              tx.oncomplete = () => resolve();
              tx.onerror = () => reject(tx.error);
            });
          } catch (e) {}
        }
        try {
          localStorage.removeItem(LS_KEY);
        } catch (e) {}
      }
    };

    // =========================================================================
    // 3. APPLICATION STATE
    // =========================================================================
    const state = {
      tab: 'home', // 'home' | 'program' | 'history' | 'records' | 'workout'
      selectedWeek: 1,
      unit: 'lb', // 'lb' | 'kg'
      workouts: [],
      activeWorkout: null,
      prs: JSON.parse(JSON.stringify(INITIAL_KNOWN_PRS)),
      workoutTimerInterval: null,
      restTimer: {
        active: false,
        running: false,
        remainingSec: 0,
        totalSec: 0,
        label: 'Rest Timer',
        interval: null
      },
      charts: {
        strength: null,
        volume: null
      },
      selectedChartExercise: 'Romanian Deadlift'
    };

    // =========================================================================
    // 4. HELPERS (Units, Epley e1RM, Formatting, Audio Chime)
    // =========================================================================
    function lbToKg(lb) { return Math.round((lb / 2.2046226218) * 10) / 10; }
    function kgToLb(kg) { return Math.round((kg * 2.2046226218) * 10) / 10; }

    function formatWeight(weightLb, unit = state.unit, includeUnit = true) {
      if (weightLb === null || weightLb === undefined || isNaN(weightLb)) return '—';
      const val = unit === 'kg' ? lbToKg(Number(weightLb)) : Math.round(Number(weightLb) * 10) / 10;
      const str = Number.isInteger(val) ? String(val) : val.toFixed(1).replace(/\.0$/, '');
      return includeUnit ? `${str} ${unit}` : str;
    }

    function calcEpley1RM(weightLb, reps) {
      const w = Number(weightLb);
      const r = Number(reps);
      if (!w || w <= 0 || !r || r <= 0) return null;
      if (r === 1) return Math.round(w * 10) / 10;
      return Math.round((w * (1 + r / 30)) * 10) / 10;
    }

    function formatDuration(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    function formatDateShort(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toast-text');
      txt.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function playRestChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        [880, 1174.66].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + idx * 0.14 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.14);
          osc.stop(ctx.currentTime + idx * 0.14 + 0.26);
        });
      } catch (e) {}
    }

    function updateStorageBadge() {
      const b = document.getElementById('storage-badge');
      if (b) b.textContent = DuoDB.mode === 'idb' ? 'IndexedDB' : 'Local';
    }

    // =========================================================================
    // 5. PROGRAM & PR LOGIC
    // =========================================================================
    function getWorkoutStatus(dayId) {
      if (state.activeWorkout && state.activeWorkout.dayId === dayId) return 'in_progress';
      if (state.workouts.some(w => w.dayId === dayId)) return 'completed';
      return 'upcoming';
    }

    function getCompletedDayIds() {
      return new Set(state.workouts.map(w => w.dayId));
    }

    function getCurrentTrainingWeek() {
      const done = getCompletedDayIds();
      for (const week of PROGRAM_WEEKS) {
        if (week.days.some(d => !done.has(d.id))) return week;
      }
      return PROGRAM_WEEKS[PROGRAM_WEEKS.length - 1];
    }

    function getNextWorkout() {
      if (state.activeWorkout) {
        const w = PROGRAM_WEEKS.find(wk => wk.weekNumber === state.activeWorkout.weekNumber);
        const d = w ? w.days.find(dy => dy.id === state.activeWorkout.dayId) : null;
        if (w && d) return { week: w, day: d, isResume: true };
      }
      const done = getCompletedDayIds();
      for (const week of PROGRAM_WEEKS) {
        for (const day of week.days) {
          if (!done.has(day.id)) return { week, day, isResume: false };
        }
      }
      return { week: PROGRAM_WEEKS[0], day: PROGRAM_WEEKS[0].days[0], isResume: false, allDone: true };
    }

    function getPreviousExercisePerformance(exerciseName) {
      for (const w of state.workouts) {
        const ex = (w.exercises || []).find(e => e.name === exerciseName && e.sets.some(s => s.completed));
        if (ex) {
          const completedSets = ex.sets.filter(s => s.completed);
          return {
            date: w.completedAt,
            summary: completedSets.map(s => `${s.weightLb ? formatWeight(s.weightLb, state.unit, true) : 'BW'} × ${s.reps || 0}`).join(', '),
            sets: completedSets
          };
        }
      }
      return null;
    }

    function mapExerciseToPrKey(name) {
      if (name === 'Squat') return 'Back Squat';
      return name;
    }

    function recomputePRsFromWorkouts(basePrs, workouts) {
      const prs = JSON.parse(JSON.stringify(INITIAL_KNOWN_PRS));
      // Preserve any custom baseline overrides if stored
      for (const [k, v] of Object.entries(basePrs || {})) {
        if (v && (v.type === 'confirmed_1rm' || v.type === 'confirmed_pr' || v.type === 'best_documented')) {
          prs[k] = JSON.parse(JSON.stringify(v));
        }
      }

      const newlyHit = [];
      // Walk oldest -> newest
      const chronological = [...workouts].sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));
      for (const w of chronological) {
        for (const ex of (w.exercises || [])) {
          const prKey = mapExerciseToPrKey(ex.name);
          for (const s of (ex.sets || [])) {
            if (!s.completed) continue;
            const wLb = Number(s.weightLb);
            const reps = Number(s.reps);
            if (!reps || reps <= 0 || isNaN(wLb) || wLb < 0) continue;
            if (wLb === 0 && !prs[prKey]) continue;

            const est1rm = calcEpley1RM(wLb, reps);
            const existing = prs[prKey];
            const prevBest = existing && existing.est1rmLb ? existing.est1rmLb : 0;

            if (!existing || existing.type === 'unknown' || (est1rm && est1rm > prevBest)) {
              const isSingle = reps === 1;
              prs[prKey] = {
                exercise: prKey,
                type: isSingle ? 'logged_1rm' : 'estimated_1rm',
                label: isSingle ? 'Logged 1RM' : 'Estimated 1RM',
                weightLb: wLb,
                reps: reps,
                est1rmLb: est1rm,
                updatedAt: w.completedAt,
                note: `${formatWeight(wLb, 'lb')} × ${reps}`
              };
            }
          }
        }
      }
      return prs;
    }

    function getWeeklyVolumeLb() {
      const now = Date.now();
      const sevenDaysAgo = now - 7 * 24 * 60 * 60 * 1000;
      return state.workouts
        .filter(w => new Date(w.completedAt).getTime() >= sevenDaysAgo)
        .reduce((sum, w) => sum + (w.totalVolumeLb || 0), 0);
    }

    // =========================================================================
    // 6. REST TIMER ENGINE
    // =========================================================================
    function startRestTimer(seconds, label) {
      clearInterval(state.restTimer.interval);
      state.restTimer.active = true;
      state.restTimer.running = true;
      state.restTimer.totalSec = seconds;
      state.restTimer.remainingSec = seconds;
      state.restTimer.label = label || 'Rest Timer';
      renderRestTimerBar();

      state.restTimer.interval = setInterval(() => {
        if (!state.restTimer.running) return;
        state.restTimer.remainingSec -= 1;
        if (state.restTimer.remainingSec <= 0) {
          state.restTimer.remainingSec = 0;
          state.restTimer.running = false;
          clearInterval(state.restTimer.interval);
          playRestChime();
          showToast('Rest complete — ready for next set!');
        }
        renderRestTimerBar();
      }, 1000);
    }

    function toggleRestTimer() {
      if (!state.restTimer.active) return;
      if (state.restTimer.remainingSec <= 0) {
        startRestTimer(state.restTimer.totalSec || 120, state.restTimer.label);
        return;
      }
      state.restTimer.running = !state.restTimer.running;
      renderRestTimerBar();
    }

    function resetRestTimer() {
      if (!state.restTimer.active) return;
      state.restTimer.remainingSec = state.restTimer.totalSec || 120;
      state.restTimer.running = false;
      renderRestTimerBar();
    }

    function adjustRestTimer(delta) {
      if (!state.restTimer.active) return;
      state.restTimer.remainingSec = Math.max(0, state.restTimer.remainingSec + delta);
      renderRestTimerBar();
    }

    function dismissRestTimer() {
      clearInterval(state.restTimer.interval);
      state.restTimer.active = false;
      state.restTimer.running = false;
      renderRestTimerBar();
    }

    function renderRestTimerBar() {
      const bar = document.getElementById('rest-timer-bar');
      if (!bar) return;
      if (!state.restTimer.active) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      document.getElementById('rest-timer-label').textContent = state.restTimer.label;
      document.getElementById('rest-timer-display').textContent = formatDuration(state.restTimer.remainingSec);
      const toggleBtn = document.getElementById('rest-toggle-btn');
      toggleBtn.innerHTML = state.restTimer.running
        ? '<i data-lucide="pause" class="w-4 h-4"></i>'
        : '<i data-lucide="play" class="w-4 h-4"></i>';
      if (window.lucide) lucide.createIcons();
    }

    // =========================================================================
    // 7. WORKOUT LOGGING ACTIONS
    // =========================================================================
    async function startOrResumeWorkout(weekNumber, dayId) {
      if (state.activeWorkout && state.activeWorkout.dayId === dayId) {
        state.tab = 'workout';
        render();
        return;
      }

      if (state.activeWorkout && state.activeWorkout.dayId !== dayId) {
        openConfirmModal(
          'Switch Active Workout?',
          `You have an unfinished workout (${state.activeWorkout.weekLabel} · ${state.activeWorkout.dayTitle}). Starting a new workout will replace your unfinished session.`,
          'Start New Workout',
          async () => {
            await createActiveWorkout(weekNumber, dayId);
          }
        );
        return;
      }

      await createActiveWorkout(weekNumber, dayId);
    }

    async function createActiveWorkout(weekNumber, dayId) {
      const week = PROGRAM_WEEKS.find(w => w.weekNumber === weekNumber);
      const day = week.days.find(d => d.id === dayId);
      const exercises = day.exercises.map(ex => {
        const prev = getPreviousExercisePerformance(ex.name);
        const sets = [];
        for (let i = 0; i < ex.sets; i++) {
          const prevSet = prev && prev.sets[i] ? prev.sets[i] : null;
          sets.push({
            setNumber: i + 1,
            weightLb: prevSet ? prevSet.weightLb : '',
            reps: prevSet ? prevSet.reps : '',
            rpe: '',
            completed: false
          });
        }
        return {
          id: ex.id,
          name: ex.name,
          prescribedSets: ex.sets,
          prescribedReps: ex.reps,
          rest: ex.rest,
          restSeconds: ex.restSeconds,
          intensity: ex.intensity,
          tempo: ex.tempo,
          prescriptionNote: ex.prescriptionNote || '',
          note: '',
          sets
        };
      });

      state.activeWorkout = {
        id: 'wrk_' + Date.now(),
        programId: 'hybrid_full_body',
        weekNumber: week.weekNumber,
        weekLabel: week.label,
        dayId: day.id,
        dayNumber: day.dayNumber,
        dayTitle: day.title,
        startedAt: new Date().toISOString(),
        exercises
      };
      await DuoDB.setState('activeWorkout', state.activeWorkout);
      state.tab = 'workout';
      render();
    }

    async function persistActiveWorkout() {
      if (state.activeWorkout) {
        await DuoDB.setState('activeWorkout', state.activeWorkout);
      }
    }

    async function finishActiveWorkout() {
      if (!state.activeWorkout) return;
      const aw = state.activeWorkout;
      const completedAt = new Date().toISOString();
      const durationSec = Math.max(1, Math.floor((new Date(completedAt) - new Date(aw.startedAt)) / 1000));

      let totalVolumeLb = 0;
      let completedSetsCount = 0;
      aw.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          if (s.completed) {
            completedSetsCount++;
            const w = Number(s.weightLb) || 0;
            const r = Number(s.reps) || 0;
            totalVolumeLb += w * r;
          }
        });
      });

      if (completedSetsCount === 0) {
        openConfirmModal(
          'No Sets Completed',
          'You have not marked any sets complete yet. Do you still want to save this session?',
          'Save Anyway',
          async () => { await finalizeWorkoutSave(aw, completedAt, durationSec, totalVolumeLb, completedSetsCount); }
        );
        return;
      }

      await finalizeWorkoutSave(aw, completedAt, durationSec, totalVolumeLb, completedSetsCount);
    }

    async function finalizeWorkoutSave(aw, completedAt, durationSec, totalVolumeLb, completedSetsCount) {
      const oldPrs = JSON.parse(JSON.stringify(state.prs));
      const finished = {
        ...aw,
        completedAt,
        durationSec,
        totalVolumeLb: Math.round(totalVolumeLb),
        completedSetsCount
      };

      await DuoDB.saveWorkout(finished);
      state.workouts = await DuoDB.getAllWorkouts();
      state.activeWorkout = null;
      await DuoDB.setState('activeWorkout', null);
      dismissRestTimer();

      state.prs = recomputePRsFromWorkouts(INITIAL_KNOWN_PRS, state.workouts);
      await DuoDB.setState('prs', state.prs);

      // Detect newly beaten PRs
      const newPrHits = [];
      for (const [k, v] of Object.entries(state.prs)) {
        const prev = oldPrs[k];
        if (v.est1rmLb && (!prev || !prev.est1rmLb || v.est1rmLb > prev.est1rmLb)) {
          newPrHits.push(v);
        }
      }

      state.tab = 'history';
      render();
      showWorkoutSummaryModal(finished, newPrHits);
    }

    function discardActiveWorkout() {
      if (!state.activeWorkout) return;
      openConfirmModal(
        'Discard Workout?',
        'This will clear your current unfinished session without saving it to History.',
        'Discard',
        async () => {
          state.activeWorkout = null;
          await DuoDB.setState('activeWorkout', null);
          dismissRestTimer();
          state.tab = 'home';
          render();
          showToast('Workout discarded');
        },
        true
      );
    }

    // 8. RENDERING VIEWS
    // =========================================================================
    function updateNavHighlight() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const t = btn.dataset.tab;
        const active = (t === state.tab) || (state.tab === 'workout' && t === 'program');
        btn.classList.toggle('text-mint', active);
        btn.classList.toggle('text-slate-400', !active);
      });
    }

    function render() {
      updateNavHighlight();
      const unitBtn = document.getElementById('unit-toggle-btn');
      if (unitBtn) unitBtn.textContent = state.unit;

      const main = document.getElementById('main-content');
      if (!main) return;

      // Destroy existing Chart.js instances before re-rendering
      if (state.charts.strength) { state.charts.strength.destroy(); state.charts.strength = null; }
      if (state.charts.volume) { state.charts.volume.destroy(); state.charts.volume = null; }
      clearInterval(state.workoutTimerInterval);

      if (state.tab === 'home') renderHome(main);
      else if (state.tab === 'program') renderProgram(main);
      else if (state.tab === 'workout') renderWorkout(main);
      else if (state.tab === 'history') renderHistory(main);
      else if (state.tab === 'records') renderRecords(main);

      if (window.lucide) lucide.createIcons();
    }

      if (histBtn) histBtn.addEventListener('click', () => { state.tab = 'history'; render(); });
      document.getElementById('home-to-records').addEventListener('click', () => { state.tab = 'records'; render(); });
    }

    // --- PROGRAM BROWSER ---
    function renderProgram(container) {
      const week = PROGRAM_WEEKS.find(w => w.weekNumber === state.selectedWeek) || PROGRAM_WEEKS[0];

      const weekPills = PROGRAM_WEEKS.map(w => {
        const active = w.weekNumber === week.weekNumber;
        const doneCount = w.days.filter(d => getWorkoutStatus(d.id) === 'completed').length;
        const label = w.isDeload ? 'Deload' : `W${w.weekNumber}`;
        return `
          <button type="button" data-week="${w.weekNumber}" class="week-pill shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold transition min-h-[40px] flex items-center gap-1.5 ${active ? 'bg-mint text-bg shadow-md shadow-mint/20' : 'bg-surface text-slate-300 border border-white/8 hover:bg-card'}">
            <span>${label}</span>
            ${doneCount === 4 ? `<i data-lucide="check-circle-2" class="w-3.5 h-3.5 ${active ? 'text-bg' : 'text-mint'}"></i>` : ''}
          </button>
        `;
      }).join('');

      const dayCards = week.days.map(day => {
        const status = getWorkoutStatus(day.id);
        let badge = '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white/8 text-slate-300">Upcoming</span>';
        let btnLabel = 'Start Workout';
        let btnCls = 'bg-mint text-bg';
        if (status === 'completed') {
          badge = '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-mint/15 text-mint">Completed</span>';
          btnLabel = 'Log Again';
          btnCls = 'bg-card text-mint border border-mint/30';
        } else if (status === 'in_progress') {
          badge = '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber/20 text-amber">In Progress</span>';
          btnLabel = 'Resume Workout';
          btnCls = 'bg-amber text-bg';
        }

        const exList = day.exercises.map(ex => `
          <div class="flex items-center justify-between py-1.5 border-b border-white/5 last:border-0 text-xs">
            <span class="text-slate-200 font-medium truncate pr-2">${escapeHtml(ex.name)}</span>
            <span class="text-slate-400 tabular-nums shrink-0">${ex.sets} × ${escapeHtml(ex.reps)} · ${escapeHtml(ex.rest)}m</span>
          </div>
        `).join('');

        return `
          <div class="bg-surface rounded-2xl p-4 border border-white/8 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h3 class="font-bold text-white text-sm">${escapeHtml(day.title)}</h3>
                <p class="text-[11px] text-slate-400">${day.exercises.length} exercises</p>
              </div>
              ${badge}
            </div>
            <div class="bg-bg/60 rounded-xl px-3 py-1.5">
              ${exList}
            </div>
            <button type="button" data-start-week="${week.weekNumber}" data-start-day="${day.id}" class="start-day-btn w-full py-3 rounded-xl font-bold text-sm ${btnCls} active:scale-[0.98] transition min-h-[44px]">
              ${btnLabel}
            </button>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="space-y-4 fade-in">
          <div>
            <h1 class="text-lg font-bold text-white">8-Week Hybrid Program</h1>
            <p class="text-xs text-slate-400">Progress at your own pace · Exact spreadsheet prescriptions</p>
          </div>
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
            ${weekPills}
          </div>
          <div class="space-y-3">
            ${dayCards}
          </div>
        </div>
      `;

      container.querySelectorAll('.week-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedWeek = Number(btn.dataset.week);
          render();
        });
      });
      container.querySelectorAll('.start-day-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          startOrResumeWorkout(Number(btn.dataset.startWeek), btn.dataset.startDay);
        });
      });
    }

    // --- ACTIVE WORKOUT LOGGING SCREEN ---
    function renderWorkout(container) {
      const aw = state.activeWorkout;
      if (!aw) { state.tab = 'program'; render(); return; }

      const elapsedSec = Math.floor((Date.now() - new Date(aw.startedAt).getTime()) / 1000);

      const exCards = aw.exercises.map((ex, exIdx) => {
        const prev = getPreviousExercisePerformance(ex.name);
        const setRows = ex.sets.map((s, sIdx) => {
          const displayWeight = s.weightLb === '' ? '' : (state.unit === 'kg' ? lbToKg(s.weightLb) : s.weightLb);
          return `
            <div class="grid grid-cols-12 gap-1.5 items-center py-1.5 ${s.completed ? 'opacity-90' : ''}">
              <div class="col-span-1 text-center text-xs font-bold text-slate-400 tabular-nums">${s.setNumber}</div>
              <div class="col-span-4">
                <input type="number" step="any" inputmode="decimal" placeholder="${state.unit}"
                  value="${escapeHtml(displayWeight)}"
                  data-ex="${exIdx}" data-set="${sIdx}" data-field="weight"
                  class="set-input w-full bg-bg border border-white/10 rounded-xl px-2.5 py-2.5 text-sm font-semibold text-white text-center tabular-nums focus:outline-none focus:border-mint min-h-[44px]" />
              </div>
              <div class="col-span-3">
                <input type="number" inputmode="numeric" placeholder="Reps"
                  value="${escapeHtml(s.reps)}"
                  data-ex="${exIdx}" data-set="${sIdx}" data-field="reps"
                  class="set-input w-full bg-bg border border-white/10 rounded-xl px-2 py-2.5 text-sm font-semibold text-white text-center tabular-nums focus:outline-none focus:border-mint min-h-[44px]" />
              </div>
              <div class="col-span-2">
                <select data-ex="${exIdx}" data-set="${sIdx}" data-field="rpe"
                  class="set-input w-full bg-bg border border-white/10 rounded-xl px-1 py-2.5 text-xs font-medium text-slate-300 text-center focus:outline-none focus:border-mint min-h-[44px]">
                  <option value="">RPE</option>
                  ${[6,7,7.5,8,8.5,9,9.5,10].map(v => `<option value="${v}" ${String(s.rpe) === String(v) ? 'selected' : ''}>${v}</option>`).join('')}
                </select>
              </div>
              <div class="col-span-2 flex justify-center">
                <button type="button" data-ex="${exIdx}" data-set="${sIdx}"
                  class="set-check w-11 h-11 rounded-xl border-2 flex items-center justify-center ${s.completed ? 'checked' : 'border-white/20 bg-bg text-slate-400 hover:border-mint/60'}"
                  aria-label="Mark set ${s.setNumber} complete">
                  <i data-lucide="check" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-surface rounded-2xl p-4 border border-white/8 space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <h3 class="font-bold text-white text-base">${escapeHtml(ex.name)}</h3>
                <div class="flex flex-wrap items-center gap-x-2.5 gap-y-1 text-xs text-slate-400 mt-1">
                  <span class="text-mint font-semibold tabular-nums">${ex.prescribedSets} sets × ${escapeHtml(ex.prescribedReps)}</span>
                  <span>Rest: ${escapeHtml(ex.rest)} min</span>
                  ${ex.intensity ? `<span>Intensity: ${escapeHtml(ex.intensity)}</span>` : ''}
                  ${ex.tempo ? `<span>Tempo: ${escapeHtml(ex.tempo)}</span>` : ''}
                </div>
              </div>
              <button type="button" data-rest-sec="${ex.restSeconds}" data-rest-name="${escapeHtml(ex.name)}" class="manual-rest-btn px-2.5 py-1.5 rounded-xl bg-card text-xs font-semibold text-mint border border-mint/20 shrink-0 flex items-center gap-1 min-h-[36px]">
                <i data-lucide="timer" class="w-3.5 h-3.5"></i>
                <span>${formatDuration(ex.restSeconds)}</span>
              </button>
            </div>

            <div class="text-[11px] px-3 py-2 rounded-xl bg-bg/80 border border-white/5 text-slate-400">
              <span class="font-semibold text-slate-300">Previous:</span>
              ${prev ? escapeHtml(prev.summary) : 'No previous session logged'}
              ${ex.prescriptionNote ? ` · <span class="text-sky">Note: ${escapeHtml(ex.prescriptionNote)}</span>` : ''}
            </div>

            <div>
              <div class="grid grid-cols-12 gap-1.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400 pb-1">
                <div class="col-span-1 text-center">Set</div>
                <div class="col-span-4 text-center">Weight (${state.unit})</div>
                <div class="col-span-3 text-center">Reps</div>
                <div class="col-span-2 text-center">RPE/RIR</div>
                <div class="col-span-2 text-center">Done</div>
              </div>
              ${setRows}
            </div>

            <input type="text" placeholder="Personal exercise notes..."
              value="${escapeHtml(ex.note || '')}"
              data-ex="${exIdx}"
              class="ex-note-input w-full bg-bg/70 border border-white/8 rounded-xl px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-mint" />
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="space-y-4 fade-in">
          <!-- Sticky Workout Action Bar -->
          <div class="bg-card rounded-2xl p-4 border border-mint/25 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <div class="text-[11px] font-semibold uppercase tracking-wider text-mint">${escapeHtml(aw.weekLabel)}</div>
              <div class="font-bold text-white text-sm truncate">${escapeHtml(aw.dayTitle)}</div>
              <div class="text-xs text-slate-400 tabular-nums mt-0.5">Elapsed: <span id="workout-elapsed" class="text-white font-semibold">${formatDuration(elapsedSec)}</span></div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <button type="button" id="discard-workout-btn" class="p-2.5 rounded-xl bg-bg text-slate-400 hover:text-danger border border-white/10 min-h-[44px] min-w-[44px] flex items-center justify-center" aria-label="Discard workout">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
              <button type="button" id="finish-workout-btn" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-mint to-teal text-bg font-bold text-sm min-h-[44px] shadow-lg shadow-mint/20 active:scale-95 transition">
                Finish Workout
              </button>
            </div>
          </div>

          <div class="space-y-3">
            ${exCards}
          </div>

          <button type="button" id="finish-workout-bottom-btn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-mint to-teal text-bg font-bold text-base shadow-xl shadow-mint/20 active:scale-[0.98] transition min-h-[52px]">
            Finish & Save Workout
          </button>
        </div>
      `;

      // Elapsed timer updater
      state.workoutTimerInterval = setInterval(() => {
        const el = document.getElementById('workout-elapsed');
        if (el && state.activeWorkout) {
          const sec = Math.floor((Date.now() - new Date(state.activeWorkout.startedAt).getTime()) / 1000);
          el.textContent = formatDuration(sec);
        }
      }, 1000);

      // Input handlers
      container.querySelectorAll('.set-input').forEach(inp => {
        inp.addEventListener('input', async () => {
          const exIdx = Number(inp.dataset.ex);
          const sIdx = Number(inp.dataset.set);
          const field = inp.dataset.field;
          const setObj = state.activeWorkout.exercises[exIdx].sets[sIdx];
          if (field === 'weight') {
            const raw = inp.value.trim();
            setObj.weightLb = raw === '' ? '' : (state.unit === 'kg' ? kgToLb(Number(raw)) : Number(raw));
          } else if (field === 'reps') {
            setObj.reps = inp.value.trim() === '' ? '' : Number(inp.value);
          } else if (field === 'rpe') {
            setObj.rpe = inp.value;
          }
          await persistActiveWorkout();
        });
      });

      container.querySelectorAll('.ex-note-input').forEach(inp => {
        inp.addEventListener('input', async () => {
          const exIdx = Number(inp.dataset.ex);
          state.activeWorkout.exercises[exIdx].note = inp.value;
          await persistActiveWorkout();
        });
      });

      container.querySelectorAll('.set-check').forEach(btn => {
        btn.addEventListener('click', async () => {
          const exIdx = Number(btn.dataset.ex);
          const sIdx = Number(btn.dataset.set);
          const ex = state.activeWorkout.exercises[exIdx];
          const setObj = ex.sets[sIdx];
          setObj.completed = !setObj.completed;
          btn.classList.toggle('checked', setObj.completed);
          btn.classList.toggle('border-white/20', !setObj.completed);
          btn.classList.toggle('bg-bg', !setObj.completed);
          btn.classList.toggle('text-slate-400', !setObj.completed);
          await persistActiveWorkout();
          if (setObj.completed) {
            startRestTimer(ex.restSeconds, `${ex.name} · Rest`);
          }
        });
      });

      container.querySelectorAll('.manual-rest-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          startRestTimer(Number(btn.dataset.restSec), `${btn.dataset.restName} · Rest`);
        });
      });

      document.getElementById('finish-workout-btn').addEventListener('click', finishActiveWorkout);
      document.getElementById('finish-workout-bottom-btn').addEventListener('click', finishActiveWorkout);
      document.getElementById('discard-workout-btn').addEventListener('click', discardActiveWorkout);
    }

    // --- HISTORY TAB ---
    function renderHistory(container) {
      if (state.workouts.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 space-y-3 fade-in">
            <div class="w-14 h-14 rounded-2xl bg-surface border border-white/10 mx-auto flex items-center justify-center text-slate-400">
              <i data-lucide="clock" class="w-7 h-7"></i>
            </div>
            <h2 class="text-lg font-bold text-white">No Completed Workouts Yet</h2>
            <p class="text-xs text-slate-400 max-w-xs mx-auto">Complete your first session from Home or Program and it will appear here with full set-by-set details.</p>
          </div>
        `;
        return;
      }

      const items = state.workouts.map(w => {
        const exSummary = (w.exercises || [])
          .filter(e => e.sets.some(s => s.completed))
          .map(e => {
            const done = e.sets.filter(s => s.completed);
            return `
              <div class="py-1.5 border-b border-white/5 last:border-0">
                <div class="text-xs font-semibold text-slate-200">${escapeHtml(e.name)}</div>
                <div class="text-[11px] text-slate-400 tabular-nums mt-0.5">
                  ${done.map(s => `${s.weightLb ? formatWeight(s.weightLb) : 'BW'} × ${s.reps || 0}${s.rpe ? ` @${s.rpe}` : ''}`).join(' · ')}
                </div>
              </div>
            `;
          }).join('');

        return `
          <div class="bg-surface rounded-2xl p-4 border border-white/8 space-y-2.5">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="text-[11px] font-semibold text-mint">${escapeHtml(w.weekLabel)} · ${formatDateShort(w.completedAt)}</div>
                <h3 class="font-bold text-white text-sm">${escapeHtml(w.dayTitle)}</h3>
                <div class="text-xs text-slate-400 tabular-nums mt-0.5">${formatDuration(w.durationSec)} · ${w.completedSetsCount} sets · ${formatWeight(w.totalVolumeLb)}</div>
              </div>
              <button type="button" data-del-id="${escapeHtml(w.id)}" class="del-hist-btn p-2 rounded-xl text-slate-400 hover:text-danger hover:bg-white/5" aria-label="Delete workout">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            ${exSummary ? `<div class="bg-bg/60 rounded-xl px-3 py-1.5">${exSummary}</div>` : ''}
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="space-y-4 fade-in">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-lg font-bold text-white">Workout History</h1>
              <p class="text-xs text-slate-400">${state.workouts.length} completed session${state.workouts.length === 1 ? '' : 's'}</p>
            </div>
          </div>
          <div class="space-y-3">${items}</div>
        </div>
      `;

      container.querySelectorAll('.del-hist-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.delId;
          openConfirmModal(
            'Delete Workout?',
            'Remove this workout from your history? Personal records will be recalculated.',
            'Delete',
            async () => {
              await DuoDB.deleteWorkout(id);
              state.workouts = await DuoDB.getAllWorkouts();
              state.prs = recomputePRsFromWorkouts(INITIAL_KNOWN_PRS, state.workouts);
              await DuoDB.setState('prs', state.prs);
              render();
              showToast('Workout removed');
            },
            true
          );
        });
      });
    }

    // --- RECORDS & CHARTS TAB ---
    function renderRecords(container) {
      const prEntries = Object.values(state.prs);
      const prHtml = prEntries.map(pr => {
        let valText = 'Unknown';
        let subText = pr.note || 'Not yet recorded';
        let badgeCls = 'bg-slate-700/60 text-slate-300';
        if (pr.type !== 'unknown') {
          const prefix = pr.isAddedLoad ? '+' : '';
          valText = `${prefix}${formatWeight(pr.weightLb)}${pr.reps > 1 ? ` × ${pr.reps}` : ''}`;
          subText = pr.reps > 1 ? `Est. 1RM: ${prefix}${formatWeight(pr.est1rmLb)}` : (pr.updatedAt ? `Logged ${formatDateShort(pr.updatedAt)}` : pr.note);
          badgeCls = (pr.type === 'confirmed_1rm' || pr.type === 'confirmed_pr' || pr.type === 'logged_1rm')
            ? 'bg-mint/15 text-mint'
            : 'bg-sky/15 text-sky';
        }
        return `
          <div class="bg-surface rounded-2xl p-3.5 border border-white/8 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-white truncate">${escapeHtml(pr.exercise)}</span>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${badgeCls} shrink-0">${escapeHtml(pr.label)}</span>
              </div>
              <div class="text-xs text-slate-400 mt-0.5">${escapeHtml(subText)}</div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-base font-bold text-white tabular-nums">${escapeHtml(valText)}</div>
            </div>
          </div>
        `;
      }).join('');

      // Exercise list for strength chart
      const loggedExercises = Array.from(new Set(
        state.workouts.flatMap(w => (w.exercises || []).filter(e => e.sets.some(s => s.completed && s.weightLb)).map(e => e.name))
      ));
      const chartOptions = loggedExercises.length > 0 ? loggedExercises : ['Romanian Deadlift', 'Squat', 'Overhead Press', 'Incline Bench Press'];
      if (!chartOptions.includes(state.selectedChartExercise)) state.selectedChartExercise = chartOptions[0];

      container.innerHTML = `
        <div class="space-y-4 fade-in">
          <div>
            <h1 class="text-lg font-bold text-white">Records & Progression</h1>
            <p class="text-xs text-slate-400">Confirmed PRs vs. Epley estimated 1RMs</p>
          </div>

          <!-- Strength Progression Chart -->
          <div class="bg-surface rounded-2xl p-4 border border-white/8 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Est. 1RM Progression</h2>
              <select id="chart-ex-select" class="bg-card border border-white/10 rounded-xl px-2.5 py-1.5 text-xs font-medium text-white max-w-[180px]">
                ${chartOptions.map(n => `<option value="${escapeHtml(n)}" ${n === state.selectedChartExercise ? 'selected' : ''}>${escapeHtml(n)}</option>`).join('')}
              </select>
            </div>
            <div class="relative h-56">
              <canvas id="strength-chart"></canvas>
            </div>
          </div>

          <!-- Volume Chart -->
          <div class="bg-surface rounded-2xl p-4 border border-white/8 space-y-3">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Session Volume (${state.unit})</h2>
            <div class="relative h-52">
              <canvas id="volume-chart"></canvas>
            </div>
          </div>

          <!-- PR List -->
          <div class="space-y-2.5">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">All Tracked Records</h2>
            ${prHtml}
          </div>
        </div>
      `;

      document.getElementById('chart-ex-select').addEventListener('change', (e) => {
        state.selectedChartExercise = e.target.value;
        buildCharts();
      });

      buildCharts();
    }

    function buildCharts() {
      if (!window.Chart) return;
      if (state.charts.strength) state.charts.strength.destroy();
      if (state.charts.volume) state.charts.volume.destroy();

      const chronological = [...state.workouts].sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));

      // Strength chart data
      const sLabels = [];
      const sData = [];
      for (const w of chronological) {
        const ex = (w.exercises || []).find(e => e.name === state.selectedChartExercise);
        if (!ex) continue;
        let maxEst = 0;
        for (const s of ex.sets) {
          if (s.completed && s.weightLb && s.reps) {
            const est = calcEpley1RM(s.weightLb, s.reps);
            if (est && est > maxEst) maxEst = est;
          }
        }
        if (maxEst > 0) {
          sLabels.push(formatDateShort(w.completedAt));
          sData.push(state.unit === 'kg' ? lbToKg(maxEst) : maxEst);
        }
      }

      const sCtx = document.getElementById('strength-chart');
      if (sCtx) {
        state.charts.strength = new Chart(sCtx, {
          type: 'line',
          data: {
            labels: sLabels.length ? sLabels : ['No Data Yet'],
            datasets: [{
              label: `Est. 1RM (${state.unit})`,
              data: sData.length ? sData : [0],
              borderColor: '#2EE6A6',
              backgroundColor: 'rgba(46, 230, 166, 0.14)',
              fill: true,
              tension: 0.35,
              pointRadius: 4,
              pointBackgroundColor: '#2EE6A6'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#94A3B8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
              y: { ticks: { color: '#94A3B8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
            }
          }
        });
      }

      // Volume chart data
      const vLabels = chronological.map(w => formatDateShort(w.completedAt));
      const vData = chronological.map(w => state.unit === 'kg' ? lbToKg(w.totalVolumeLb || 0) : (w.totalVolumeLb || 0));

      const vCtx = document.getElementById('volume-chart');
      if (vCtx) {
        state.charts.volume = new Chart(vCtx, {
          type: 'bar',
          data: {
            labels: vLabels.length ? vLabels : ['No Sessions'],
            datasets: [{
              label: `Volume (${state.unit})`,
              data: vData.length ? vData : [0],
              backgroundColor: '#38BDF8',
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#94A3B8', font: { size: 10 } }, grid: { display: false } },
              y: { ticks: { color: '#94A3B8', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
            }
          }
        });
      }
    }

    // =========================================================================
    // 9. MODALS: SETTINGS, BACKUP (JSON/CSV/ICLOUD FILES), SUMMARY, CONFIRM
    // =========================================================================
    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = html;
      backdrop.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function openConfirmModal(title, message, confirmLabel, onConfirm, isDanger = false) {
      openModal(`
        <div class="space-y-4">
          <h2 class="text-lg font-bold text-white">${escapeHtml(title)}</h2>
          <p class="text-sm text-slate-300 leading-relaxed">${escapeHtml(message)}</p>
          <div class="flex items-center gap-2.5 pt-2">
            <button type="button" id="modal-cancel-btn" class="flex-1 py-3 rounded-xl bg-card text-slate-200 font-semibold text-sm min-h-[44px]">Cancel</button>
            <button type="button" id="modal-confirm-btn" class="flex-1 py-3 rounded-xl ${isDanger ? 'bg-danger text-white' : 'bg-mint text-bg'} font-bold text-sm min-h-[44px]">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      `);
      document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
      document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
        closeModal();
        await onConfirm();
      });
    }

    function showWorkoutSummaryModal(workout, newPrHits) {
      const prBanner = newPrHits.length > 0 ? `
        <div class="rounded-2xl bg-mint/15 border border-mint/30 p-3.5 space-y-1.5">
          <div class="text-xs font-bold uppercase tracking-wider text-mint flex items-center gap-1.5">
            <i data-lucide="trophy" class="w-4 h-4"></i> New Personal Record${newPrHits.length > 1 ? 's' : ''}!
          </div>
          ${newPrHits.map(p => `<div class="text-sm font-semibold text-white">${escapeHtml(p.exercise)}: ${formatWeight(p.weightLb)} × ${p.reps} (Est. 1RM ${formatWeight(p.est1rmLb)})</div>`).join('')}
        </div>
      ` : '';

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold uppercase tracking-wider text-mint">Session Complete</span>
            <button type="button" id="summary-close-x" class="p-1.5 rounded-lg text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <h2 class="text-xl font-bold text-white">${escapeHtml(workout.weekLabel)} · ${escapeHtml(workout.dayTitle)}</h2>
          <div class="grid grid-cols-3 gap-2.5 text-center">
            <div class="bg-card rounded-2xl p-3">
              <div class="text-[11px] text-slate-400">Duration</div>
              <div class="text-base font-bold text-white tabular-nums mt-0.5">${formatDuration(workout.durationSec)}</div>
            </div>
            <div class="bg-card rounded-2xl p-3">
              <div class="text-[11px] text-slate-400">Sets</div>
              <div class="text-base font-bold text-white tabular-nums mt-0.5">${workout.completedSetsCount}</div>
            </div>
            <div class="bg-card rounded-2xl p-3">
              <div class="text-[11px] text-slate-400">Volume</div>
              <div class="text-base font-bold text-mint tabular-nums mt-0.5">${formatWeight(workout.totalVolumeLb)}</div>
            </div>
          </div>
          ${prBanner}
          <button type="button" id="summary-done-btn" class="w-full py-3.5 rounded-2xl bg-mint text-bg font-bold text-sm min-h-[48px]">Done</button>
        </div>
      `);
      document.getElementById('summary-close-x').addEventListener('click', closeModal);
      document.getElementById('summary-done-btn').addEventListener('click', closeModal);
    }

    function openSettingsModal() {
      const expansionList = PROGRAM_MODULES.filter(m => m.status === 'planned').map(m => `
        <div class="flex items-center justify-between py-2 border-b border-white/5 last:border-0 text-xs">
          <div>
            <div class="font-semibold text-slate-200">${escapeHtml(m.name)}</div>
            <div class="text-[11px] text-slate-400">${escapeHtml(m.description)}</div>
          </div>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-white/8 text-slate-400">Planned</span>
        </div>
      `).join('');

      openModal(`
        <div class="space-y-5">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-white">Settings & Backup</h2>
            <button type="button" id="settings-close-btn" class="p-2 rounded-xl text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <!-- Units -->
          <div class="bg-card rounded-2xl p-4 flex items-center justify-between">
            <div>
              <div class="text-sm font-semibold text-white">Weight Units</div>
              <div class="text-xs text-slate-400">Pounds (lb) default, or Kilograms (kg)</div>
            </div>
            <div class="flex rounded-xl bg-bg p-1 border border-white/10">
              <button type="button" id="set-unit-lb" class="px-3 py-1.5 rounded-lg text-xs font-bold ${state.unit === 'lb' ? 'bg-mint text-bg' : 'text-slate-400'}">lb</button>
              <button type="button" id="set-unit-kg" class="px-3 py-1.5 rounded-lg text-xs font-bold ${state.unit === 'kg' ? 'bg-mint text-bg' : 'text-slate-400'}">kg</button>
            </div>
          </div>

          <!-- Backup & Export -->
          <div class="space-y-2.5">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Data & iCloud Drive Backup</div>
            <p class="text-xs text-slate-400">Data is stored locally in ${DuoDB.mode === 'idb' ? 'IndexedDB' : 'Local Storage'}. Export a JSON backup and choose <strong class="text-slate-200">Save to Files → iCloud Drive</strong> on iPhone.</p>
            <div class="grid grid-cols-2 gap-2.5">
              <button type="button" id="export-json-btn" class="py-3 px-3 rounded-xl bg-mint text-bg font-bold text-xs flex items-center justify-center gap-1.5 min-h-[44px]">
                <i data-lucide="download" class="w-4 h-4"></i> Export JSON
              </button>
              <button type="button" id="export-csv-btn" class="py-3 px-3 rounded-xl bg-card border border-white/10 text-white font-semibold text-xs flex items-center justify-center gap-1.5 min-h-[44px]">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Export CSV
              </button>
            </div>
            <label class="w-full py-3 px-3 rounded-xl bg-card border border-white/10 text-slate-200 font-semibold text-xs flex items-center justify-center gap-1.5 min-h-[44px] cursor-pointer hover:bg-cardHover">
              <i data-lucide="upload" class="w-4 h-4"></i> Restore JSON Backup
              <input type="file" id="import-json-input" accept=".json,application/json" class="hidden" />
            </label>
            <button type="button" id="clear-data-btn" class="w-full py-3 px-3 rounded-xl bg-danger/15 border border-danger/30 text-danger font-bold text-xs min-h-[44px]">
              Delete All Workout Data
            </button>
          </div>

          <!-- Future Expansion Architecture -->
          <div class="space-y-2">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">Architecture & Future Modules</div>
            <div class="bg-bg/70 rounded-2xl px-3.5 py-1 border border-white/5">
              ${expansionList}
            </div>
          </div>
        </div>
      `);

      document.getElementById('settings-close-btn').addEventListener('click', closeModal);
      document.getElementById('set-unit-lb').addEventListener('click', async () => {
        state.unit = 'lb';
        await DuoDB.setState('unit', 'lb');
        closeModal();
        render();
      });
      document.getElementById('set-unit-kg').addEventListener('click', async () => {
        state.unit = 'kg';
        await DuoDB.setState('unit', 'kg');
        closeModal();
        render();
      });
      document.getElementById('export-json-btn').addEventListener('click', exportJsonBackup);
      document.getElementById('export-csv-btn').addEventListener('click', exportCsvHistory);
      document.getElementById('import-json-input').addEventListener('change', handleImportBackup);
      document.getElementById('clear-data-btn').addEventListener('click', () => {
        openConfirmModal(
          'Delete All Data?',
          'This will permanently erase all logged workouts, active sessions, and custom PRs from this device. Export a JSON backup first if you want to keep your history.',
          'Delete Everything',
          async () => {
            await DuoDB.clearAll();
            state.workouts = [];
            state.activeWorkout = null;
            state.prs = JSON.parse(JSON.stringify(INITIAL_KNOWN_PRS));
            state.unit = 'lb';
            dismissRestTimer();
            state.tab = 'home';
            render();
            showToast('All data cleared');
          },
          true
        );
      });
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportJsonBackup() {
      const payload = {
        app: 'DUO Training',
        version: 1,
        exportedAt: new Date().toISOString(),
        unit: state.unit,
        workouts: state.workouts,
        activeWorkout: state.activeWorkout,
        prs: state.prs
      };
      const dateStr = new Date().toISOString().slice(0, 10);
      downloadFile(`duo-training-backup-${dateStr}.json`, JSON.stringify(payload, null, 2), 'application/json');
      showToast('JSON backup exported');
    }

    function exportCsvHistory() {
      const rows = [['Date', 'Week', 'Day', 'DurationSec', 'Exercise', 'Set', 'WeightLb', 'Reps', 'RPE', 'Completed', 'Note']];
      for (const w of state.workouts) {
        for (const ex of (w.exercises || [])) {
          for (const s of (ex.sets || [])) {
            rows.push([
              w.completedAt,
              w.weekLabel,
              w.dayTitle,
              w.durationSec,
              ex.name,
              s.setNumber,
              s.weightLb,
              s.reps,
              s.rpe || '',
              s.completed ? 'true' : 'false',
              (ex.note || '').replace(/"/g, '""')
            ]);
          }
        }
      }
      const csv = rows.map(r => r.map(v => `"${String(v ?? '')}"`).join(',')).join('\n');
      const dateStr = new Date().toISOString().slice(0, 10);
      downloadFile(`duo-training-history-${dateStr}.csv`, csv, 'text/csv');
      showToast('CSV exported');
    }

    async function handleImportBackup(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data || !Array.isArray(data.workouts)) throw new Error('Invalid backup format');

        await DuoDB.clearAll();
        if (data.unit === 'kg' || data.unit === 'lb') {
          state.unit = data.unit;
          await DuoDB.setState('unit', state.unit);
        }
        for (const w of data.workouts) {
          await DuoDB.saveWorkout(w);
        }
        state.workouts = await DuoDB.getAllWorkouts();
        state.activeWorkout = data.activeWorkout || null;
        if (state.activeWorkout) await DuoDB.setState('activeWorkout', state.activeWorkout);
        state.prs = recomputePRsFromWorkouts(INITIAL_KNOWN_PRS, state.workouts);
        await DuoDB.setState('prs', state.prs);

        closeModal();
        render();
        showToast(`Restored ${state.workouts.length} workout(s)`);
      } catch (err) {
        showToast('Invalid backup file');
      }
    }

    // =========================================================================
    // 10. INITIALIZATION & GLOBAL LISTENERS
    // =========================================================================
    async function bootstrap() {
      await DuoDB.init();
      const savedUnit = await DuoDB.getState('unit', 'lb');
      state.unit = savedUnit === 'kg' ? 'kg' : 'lb';
      state.workouts = await DuoDB.getAllWorkouts();
      state.activeWorkout = await DuoDB.getState('activeWorkout', null);
      state.prs = recomputePRsFromWorkouts(INITIAL_KNOWN_PRS, state.workouts);

      // Nav tabs
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.tab = btn.dataset.tab;
          render();
        });
      });

      // Unit toggle
      document.getElementById('unit-toggle-btn').addEventListener('click', async () => {
        state.unit = state.unit === 'lb' ? 'kg' : 'lb';
        await DuoDB.setState('unit', state.unit);
        render();
      });

      // Settings button
      document.getElementById('open-settings-btn').addEventListener('click', openSettingsModal);

      // Modal backdrop dismiss
      document.getElementById('modal-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modal-backdrop') closeModal();
      });

      // Rest timer controls
      document.getElementById('rest-minus-btn').addEventListener('click', () => adjustRestTimer(-30));
      document.getElementById('rest-plus-btn').addEventListener('click', () => adjustRestTimer(30));
      document.getElementById('rest-toggle-btn').addEventListener('click', toggleRestTimer);
      document.getElementById('rest-reset-btn').addEventListener('click', resetRestTimer);
      document.getElementById('rest-close-btn').addEventListener('click', dismissRestTimer);

      render();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      }
    }

    window.addEventListener('DOMContentLoaded', bootstrap);
  })();
  </script>
</body>
</html>
